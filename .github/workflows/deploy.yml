name: Deploy Kubernetes
on:
    workflow_call:

jobs:
    deploy:
        name: "Deploy"
        runs-on: self-hosted
        steps:
            - name: Obtendo o código do projeto
              uses: actions/checkout@v7.0.1

            - name: Setup kubectl
              uses: azure/setup-kubectl@v4
              with:
                version: 'latest'

            - name: Setup kind
              uses: helm/kind-action@v1
              with:
                cluster_name: laboratorio

            - name: Build da imagem local
              run: docker build -t minha-api:local -f src/Review-Filmes.Web/Dockerfile src

            - name: Carregar imagem no Kind
              run: kind load docker-image minha-api:local --name laboratorio

            - name: Deploy no Kubernetes
              run: kubectl apply -f k8s/deployment.yaml

            - name: Aguardar rollout da aplicação
              run: kubectl rollout status deployment/reviewfilmes --timeout=180s