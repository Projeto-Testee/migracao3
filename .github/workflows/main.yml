name: Pipeline CI/CD
run-name: Pipeline CI/CD executada por ${{github.actor}} em ${{github.run_number}}

on: 
    workflow_dispatch:
    push:
      branches:
        - main

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Obtendo o código do projeto
              uses: actions/checkout@v7.0.1            

            - name : Setup dotnet
              uses: actions/setup-dotnet@v6.0.0
              with:
                dotnet-version: "8.0.300"

            - name: Execução do comando build
              working-directory: ./src
              run: dotnet build Review-Filmes.sln
    
    release:
      name: Criação de Release
      runs-on: ubuntu- latest
      needs: [build]
      steps:
        - name: Obtendo código do projeto
          uses: actions/checkout@v7.0.1

        - name: Efetuando login no Docker Hub
          uses: docker/login-action@v4.5.1
          with:
            username: ${{secrets.DOCKERHUB_USER}}
            password: ${{secrets.DOCKERHUB_PWD}}

        - name: Build e Push da Imagem Docker
          uses: docker/build-push-action@v6
          with:
            push : true
            context : ./src
            file: ./src/Review-Filmes.Web/Dockerfile
            tags: |
              yuriromao/projeto-devops-pro:latest
              yuriromao/projeto-devops-pro:v${{github.run_number}}